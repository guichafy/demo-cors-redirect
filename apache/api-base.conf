ServerName localhost

<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !cgid_module>
    LoadModule cgid_module modules/mod_cgid.so
</IfModule>

DocumentRoot "/demo/api"
<Directory "/demo/api">
    Require all granted
    <Files "receber.cgi">
        Options +ExecCGI
        SetHandler cgi-script
    </Files>
</Directory>

# A API responde ao preflight com 204.
RewriteEngine On
RewriteCond %{REQUEST_METHOD} =OPTIONS
RewriteRule "^/receber\.cgi$" "-" [R=204,L]

Header always set Access-Control-Allow-Origin "http://localhost:8090"
Header always set Access-Control-Allow-Methods "POST"
Header always set Access-Control-Allow-Headers "Content-Type"
Header always set Access-Control-Max-Age "0"

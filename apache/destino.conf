ServerName localhost

<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

DocumentRoot "/demo/destino"
<Directory "/demo/destino">
    Require all granted
</Directory>

RewriteEngine On
RewriteRule "^/redirecionar-api$" "http://localhost:8070/receber.cgi" [R=307,L,QSD]

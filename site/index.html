<!doctype html>
<html lang="pt-BR">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de CORS com HTTP 307</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    button { font: inherit; padding: .45rem .75rem; }
  </style>

<body>
  <main>
    <h1>Teste de CORS com HTTP 307</h1>
